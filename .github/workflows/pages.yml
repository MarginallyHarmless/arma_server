name: Deploy server watch to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  # Let an in-flight publish finish; cancelling can leave Pages locked.
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Clear the stale Pages deployment cancellation
        if: github.event.head_commit.message == 'Clear stale Pages cancellation and publish'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          endpoint="repos/$GITHUB_REPOSITORY/pages/deployments/a2dcbd952e60e4f9ec47a16a654d34c5cd598fd3"
          gh api "$endpoint"
          if gh api --method POST "$endpoint/cancel" > cancel-result.txt 2>&1; then
            echo "Pages cancellation acknowledged"
          else
            cat cancel-result.txt
            if ! grep -q "as it's finished" cancel-result.txt; then
              exit 1
            fi
          fi
          gh api "$endpoint"
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm test
      - run: npm run build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
          name: github-pages-${{ github.run_attempt }}
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: github-pages-${{ github.run_attempt }}
          timeout: 1200000
